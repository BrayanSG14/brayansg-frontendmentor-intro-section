<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Intro section with dropdown navigation</title>
</head>
<body>
  <header class="header">
    <img class="logo" src="./images/logo.svg" alt="Snap logo">
    <button class="btn-menu" id="btn-menu" type="button" aria-label="Open menu">
      <img src="./images/icon-menu.svg" alt="">
    </button>
    <div class="overlay" id="overlay"></div>
    <nav class="nav" id="nav">
      <button class="btn-close" id="btn-close" type="button" aria-label="Close menu">
        <img src="./images/icon-close-menu.svg" alt="">
      </button>
      <ul class="nav-list">
        <li class="nav-item">
          <button class="btn-dropdown" type="button">
            Features
            <img class="arrow" src="./images/icon-arrow-down.svg" alt="">
          </button>
          <ul class="dropdown dropdown-features">
            <li>
              <a class="dropdown-link" href="#">
                <img src="./images/icon-todo.svg" alt="">
                Todo List
              </a>
            </li>
            <li>
              <a class="dropdown-link" href="#">
                <img src="./images/icon-calendar.svg" alt="">
                Calendar
              </a>
            </li>
            <li>
              <a class="dropdown-link" href="#">
                <img src="./images/icon-reminders.svg" alt="">
                Reminders
              </a>
            </li>
            <li>
              <a class="dropdown-link" href="#">
                <img src="./images/icon-planning.svg" alt="">
                Planning
              </a>
            </li>
          </ul>
        </li>
        <li class="nav-item">
          <button class="btn-dropdown" type="button">
            Company
            <img class="arrow" src="./images/icon-arrow-down.svg" alt="">
          </button>
          <ul class="dropdown dropdown-company">
            <li><a class="dropdown-link" href="#">History</a></li>
            <li><a class="dropdown-link" href="#">Our Team</a></li>
            <li><a class="dropdown-link" href="#">Blog</a></li>
          </ul>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Careers</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">About</a>
        </li>
      </ul>
      <div class="nav-auth">
        <a class="btn-login" href="#">Login</a>
        <a class="btn-register" href="#">Register</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero">
      <picture>
        <source media="(min-width: 1024px)" srcset="./images/image-hero-desktop.png">
        <img class="hero-img" src="./images/image-hero-mobile.png" alt="Man working on a laptop">
      </picture>
      <div class="hero-content">
        <h1>Make remote work</h1>
        <p>Get your team in sync, no matter your location. Streamline processes, create team rituals, and watch productivity soar.</p>
        <a class="btn-learn" href="#">Learn more</a>
        <div class="clients">
          <img src="./images/client-databiz.svg" alt="Databiz">
          <img src="./images/client-audiophile.svg" alt="Audiophile">
          <img src="./images/client-meet.svg" alt="Meet">
          <img src="./images/client-maker.svg" alt="Maker">
        </div>
      </div>
    </section>
  </main>

  <script>
    const btnMenu = document.getElementById("btn-menu");
    const btnClose = document.getElementById("btn-close");
    const nav = document.getElementById("nav");
    const overlay = document.getElementById("overlay");
    const btnDropdowns = document.querySelectorAll(".btn-dropdown");
    btnMenu.addEventListener("click", function() {
      nav.classList.add("active");
      overlay.classList.add("active");
    });
    btnClose.addEventListener("click", function() {
      nav.classList.remove("active");
      overlay.classList.remove("active");
    });
    overlay.addEventListener("click", function() {
      nav.classList.remove("active");
      overlay.classList.remove("active");
    });
    btnDropdowns.forEach((btn) => {
      btn.addEventListener("click", function() {
        btn.parentElement.classList.toggle("active");
      });
    });
  </script>
</body>
</html>
